[project]
name = "asa-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asa-core",
    "celery[redis]>=5.4.0,<6",
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
]

[project.scripts]
asa-api = "asa_api.startup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asa_api"]
