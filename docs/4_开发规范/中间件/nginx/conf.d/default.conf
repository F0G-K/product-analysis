# ============================================================
# 站点配置 — 产品管理智能助手平台
# upstream 指向 FastAPI 后端 (app 容器或宿主机)
# ============================================================

upstream fastapi_backend {
    # 指向宿主机 FastAPI (开发环境)
    server host.docker.internal:8080 max_fails=3 fail_timeout=30s;
    # 生产环境指向应用容器:
    # server pa-app:8080 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

# ========== HTTP → HTTPS 重定向 ==========
server {
    listen 80;
    server_name _;

    # Let's Encrypt 验证路径 (生产环境)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余全部重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ========== HTTPS 主站 ==========
server {
    listen       443 ssl http2;
    server_name  _;

    # ----- SSL (开发环境自签证书, 生产替换为 Let's Encrypt) -----
    # 生成自签证书: openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #   -keyout ssl/key.pem -out ssl/cert.pem \
    #   -subj "/CN=localhost"
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # SSL 协议与加密套件
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ----- 安全头 -----
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ----- 静态原型页面 (原型阶段) -----
    location /prototype/ {
        alias /usr/share/nginx/html/prototype/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # ----- API 代理 -----
    location /api/ {
        # 限流 (通用 30r/s)
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass              http://fastapi_backend;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Connection         "";

        # 超时 (PRD 9.1: 分析任务最长 15min)
        proxy_read_timeout      900s;
        proxy_connect_timeout   10s;
        proxy_send_timeout      60s;
    }

    # ----- 登录接口 (额外限制, 防暴力破解 PRD 6.0.3) -----
    location /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;

        proxy_pass              http://fastapi_backend;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Connection         "";

        proxy_read_timeout      30s;
        proxy_connect_timeout   5s;
    }

    # ----- WebSocket (任务状态推送 PRD 6.5) -----
    location /ws/ {
        proxy_pass              http://fastapi_backend;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        "upgrade";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        proxy_read_timeout      86400s;
    }

    # ----- 健康检查 -----
    location /health {
        proxy_pass              http://fastapi_backend;
        proxy_http_version      1.1;
        access_log              off;
    }
}
