# ============================================================
# 产品管理智能助手平台 — 中间件 Docker Compose
# 基于: 概要设计总纲 V1.0 (docs/3_概要设计/概要设计_总纲.md)
#
# 包含中间件:
#   - PostgreSQL 16   : 业务数据、审计日志
#   - Redis 7.2       : 会话管理、缓存、Celery Broker、限流
#   - ChromaDB        : 文档向量嵌入存储 (开发环境)
#   - MinIO           : 文档原文、任务快照、导出文件 (本地 S3)
#   - Nginx 1.25      : 反向代理、SSL 终止、静态资源、限流
#
# 账密规范:
#   - 需认证的中间件: 用户名=root, 密码=kkkcm520
#   - 无需认证的中间件: ChromaDB (开发模式), Nginx
# ============================================================
name: product-analysis

# ========== 网络 ==========
networks:
  pa-network:
    name: product-analysis-net
    driver: bridge

# ========== 数据卷 ==========
volumes:
  pgdata:
    name: pa-pgdata
  redisdata:
    name: pa-redisdata
  chromadata:
    name: pa-chromadata
  miniodata:
    name: pa-miniodata

# ========== 服务 ==========
services:

  # ----------------------------------------------------------
  # PostgreSQL 16 — 关系数据库
  # 存储: 租户、用户、项目、任务、审计日志等全部结构化业务数据
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: kkkcm520
      POSTGRES_DB: product_analysis
      # 时区 (PRD 6.4.2: 统一项目时区)
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 初始化脚本 (可选)
      - ./init-sql:/docker-entrypoint-initdb.d:ro
    networks:
      - pa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d product_analysis"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 性能调优 (开发环境裁剪)
    command: |
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c maintenance_work_mem=32MB
      -c wal_buffers=8MB
      -c random_page_cost=1.2
      -c max_connections=50
    # 内存限制 (dev: 512MB 上限)
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  # ----------------------------------------------------------
  # Redis 7.2 — 缓存 / 会话 / Celery Broker / 限流
  # PRD 6.0.6: 服务端会话 + 空闲超时 30min / 绝对超时 12h
  # 概要设计 7.1: Redis Key = {tenant_id}:{resource_type}:{id}
  # ----------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: pa-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass kkkcm520
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --tcp-keepalive 300
    # 内存限制 (dev: 256MB 上限)
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - pa-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "kkkcm520", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------
  # ChromaDB — 向量数据库 (开发环境)
  # 存储: 文档 Embedding 向量, 支持语义检索
  # 生产环境替换为 Milvus 2.4+
  # 开发模式无需认证
  # ----------------------------------------------------------
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: pa-chromadb
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/data
      ANONYMIZED_TELEMETRY: "FALSE"
      # 租户隔离 (概要设计 6.4): 检索时通过 metadata 过滤
      CHROMA_SERVER_AUTHN_CREDENTIALS: ""       # 开发模式无需认证
      CHROMA_SERVER_AUTHN_PROVIDER: ""           # 开发模式无需认证
    # 内存限制 (dev: 512MB 上限)
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    ports:
      - "8000:8000"
    volumes:
      - chromadata:/chroma/data
    networks:
      - pa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------
  # MinIO — 对象存储 (本地 S3 替代)
  # 存储: 文档原文、任务快照 JSON、导出 Markdown/Excel 文件
  # PRD 6.3.6: 基线快照不可变; 概要设计 5.3: 快照压缩存储
  # ----------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: pa-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: kkkcm520
      TZ: Asia/Shanghai
    # 内存限制 (dev: 256MB 上限)
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - miniodata:/data
    networks:
      - pa-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------
  # MinIO Client — 初始化 Bucket (一次性任务)
  # 创建应用所需的 Bucket:
  #   - documents     : 原始文档
  #   - snapshots     : 任务输入快照
  #   - exports       : 导出文件
  # ----------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: pa-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
      mc alias set local http://minio:9000 root kkkcm520;
      mc mb --ignore-existing local/documents;
      mc mb --ignore-existing local/snapshots;
      mc mb --ignore-existing local/exports;
      echo 'MinIO buckets ready.';
      exit 0;
      "
    # 内存限制 (一次性任务, 用完即释放)
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m
    networks:
      - pa-network

  # ----------------------------------------------------------
  # Nginx 1.27 — 反向代理 + 静态资源
  # PRD 9.3: 全链路 TLS, PRD 9.1: 限流
  # 概要设计 3.1: 接入层 — SSL 终止、静态资源、限流
  # 无需认证
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: pa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # SSL 证书 (生产环境替换为真实证书)
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # 前端静态资源 (原型阶段: docs/2_原型图)
      - ../../2_原型图:/usr/share/nginx/html/prototype:ro
    # 内存限制 (dev: 128MB 上限)
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m
    networks:
      - pa-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
