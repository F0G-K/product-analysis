[project]
name = "asa-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asa-core",
    "celery[redis]>=5.4.0,<6",
    "httpx>=0.28.0",
    "langgraph>=0.6.0,<2",
    "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asa_worker"]
