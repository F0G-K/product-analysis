<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忘记密码 - 产品管理智能助手平台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
      }
    }
  }
}
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen flex items-center justify-center p-8" style="background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);">
<div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
  <!-- Header -->
  <div class="text-center mb-8">
    <div class="flex items-center justify-center gap-2 mb-4">
      <span class="w-8 h-8 rounded-lg bg-primary-100 flex items-center justify-center">
        <i class="fa-solid fa-cubes text-primary-600"></i>
      </span>
      <span class="font-bold text-gray-800">产品管理智能助手</span>
    </div>
    <h2 class="text-2xl font-bold text-gray-800">重置密码</h2>
    <p class="text-sm text-gray-500 mt-1">输入你的注册邮箱，我们将发送重置链接</p>
  </div>

  <!-- Step 1: Enter Email -->
  <form class="space-y-4" id="step1">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">注册邮箱</label>
      <div class="relative">
        <i class="fa-solid fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
        <input type="email" placeholder="name@company.com" class="w-full pl-10 pr-3 py-2.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-200 focus:border-primary-500">
      </div>
    </div>
    <button type="submit" class="w-full py-2.5 bg-primary-600 hover:bg-primary-700 text-white rounded-lg text-sm font-medium transition-colors">
      发送重置链接
    </button>
  </form>

  <!-- Success: Email Sent -->
  <div class="text-center space-y-4 hidden" id="step2">
    <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mx-auto">
      <i class="fa-solid fa-paper-plane text-green-500 text-2xl"></i>
    </div>
    <div>
      <h3 class="text-lg font-semibold text-gray-800">邮件已发送</h3>
      <p class="text-sm text-gray-500 mt-1">如果该邮箱已注册，你将收到一封包含密码重置链接的邮件。链接有效期为 30 分钟。</p>
    </div>
    <div class="p-3 rounded-lg bg-amber-50 border border-amber-100 text-xs text-amber-700">
      <i class="fa-solid fa-circle-info"></i> 没收到邮件？请检查垃圾邮件文件夹，或确认邮箱地址是否正确。
    </div>
  </div>

  <!-- Step 3: Set New Password -->
  <form class="space-y-4 hidden" id="step3">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">新密码</label>
      <div class="relative">
        <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
        <input type="password" placeholder="输入新密码" class="w-full pl-10 pr-3 py-2.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-200 focus:border-primary-500">
      </div>
      <div class="mt-2 flex items-center gap-2">
        <div class="flex-1 h-1.5 rounded-full bg-gray-200"><div class="h-1.5 rounded-full bg-red-400" style="width:40%"></div></div>
        <span class="text-xs text-gray-400">弱</span>
      </div>
      <ul class="mt-2 space-y-1">
        <li class="text-xs text-gray-400 flex items-center gap-1"><i class="fa-regular fa-circle text-[8px]"></i> 至少 8 位字符</li>
        <li class="text-xs text-gray-400 flex items-center gap-1"><i class="fa-regular fa-circle text-[8px]"></i> 包含大小写字母、数字和特殊字符中的至少三类</li>
        <li class="text-xs text-gray-400 flex items-center gap-1"><i class="fa-regular fa-circle text-[8px]"></i> 不能与最近 5 次密码相同</li>
      </ul>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">确认新密码</label>
      <div class="relative">
        <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
        <input type="password" placeholder="再次输入新密码" class="w-full pl-10 pr-3 py-2.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-200 focus:border-primary-500">
      </div>
    </div>
    <button type="submit" class="w-full py-2.5 bg-primary-600 hover:bg-primary-700 text-white rounded-lg text-sm font-medium transition-colors">
      重置密码并登录
    </button>
  </form>

  <!-- Success: Password Reset Complete -->
  <div class="text-center space-y-4 hidden" id="step4">
    <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mx-auto">
      <i class="fa-solid fa-circle-check text-green-500 text-2xl"></i>
    </div>
    <div>
      <h3 class="text-lg font-semibold text-gray-800">密码重置成功</h3>
      <p class="text-sm text-gray-500 mt-1">你的密码已更新。所有设备上的会话已失效，请使用新密码重新登录。</p>
    </div>
    <a href="00_登录.html" class="block w-full py-2.5 bg-primary-600 hover:bg-primary-700 text-white rounded-lg text-sm font-medium transition-colors text-center">
      返回登录
    </a>
  </div>

  <!-- Invalid Link State -->
  <div class="text-center space-y-4 hidden" id="expiredState">
    <div class="w-16 h-16 rounded-full bg-red-100 flex items-center justify-center mx-auto">
      <i class="fa-solid fa-link-slash text-red-500 text-2xl"></i>
    </div>
    <div>
      <h3 class="text-lg font-semibold text-gray-800">链接已失效</h3>
      <p class="text-sm text-gray-500 mt-1">此密码重置链接已过期或已被使用。请重新申请重置链接。</p>
    </div>
    <button class="w-full py-2.5 bg-primary-600 hover:bg-primary-700 text-white rounded-lg text-sm font-medium transition-colors" onclick="document.getElementById('step1').classList.remove('hidden');document.getElementById('expiredState').classList.add('hidden');">
      重新申请
    </button>
  </div>

  <!-- Footer -->
  <div class="mt-6 text-center">
    <a href="00_登录.html" class="text-sm text-primary-600 hover:text-primary-700 flex items-center justify-center gap-1">
      <i class="fa-solid fa-arrow-left text-xs"></i> 返回登录
    </a>
  </div>
</div>
</body>
</html>
